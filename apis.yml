name: Fifteenth
description: >-
  Fifteenth is a San Francisco-based fintech company operating an AI-powered
  personal tax platform for ambitious earners — founders, investors, executives,
  and technology professionals with complex financial situations such as equity
  compensation (ISOs, RSOs, RSUs, NSOs), liquidity events (IPOs and acquisitions),
  partnership income (K-1s), and active stock and crypto trading. The service
  pairs dedicated human CPAs with AI-driven automation: users link their banking,
  payroll, and investment accounts via one-click integrations (Workday, Rippling,
  Robinhood, Wealthfront, Carta, Charles Schwab, AngelList, Coinbase and more),
  and the platform automatically detects tax-relevant transactions, organizes
  documents, models scenarios, and delivers proactive quarterly planning plus
  unlimited year-round advice at flat-fee pricing starting around $1,000 per year.
  Fifteenth raised $8.25M in seed funding (February 2025) led by A* and General
  Catalyst. It is a consumer-facing product with no public developer API surface;
  this profile captures its identity and public web properties.
